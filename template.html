            <div class="port-grid port-grid-2">

        <!-- Professional Experience (from sections/experience.html) -->

    </div>

    <!-- Interactive Project Detail Modal -->
    <div id="project-modal" class="project-modal" aria-hidden="true" role="dialog">
        <div class="project-modal-backdrop" id="modal-backdrop"></div>
        <div class="project-modal-dialog">
            <button class="modal-close-btn" id="modal-close" aria-label="Close dialog">&times;</button>
            <div id="modal-content">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- Script for Interactive Project Details -->
    <script>
        const projectsData = {{PROJECTS_DATA_JSON}};

        const modal = document.getElementById('project-modal');
        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalClose = document.getElementById('modal-close');
        const modalContent = document.getElementById('modal-content');

        function openProjectModal(projectId) {
            const data = projectsData[projectId];
            if (!data) return;

            let linksHtml = '';
            if (data.links && data.links.length > 0) {
                linksHtml = '<div class="modal-links-bar">';
                data.links.forEach(l => {
                    const target = l.external ? ' target="_blank" rel="noopener noreferrer"' : '';
                    linksHtml += `<a href="${l.url}" class="modal-action-link"${target}>${l.text}</a>`;
                });
                // Add dedicated page link
                linksHtml += `<a href="projects/${projectId}.html" class="modal-action-link" style="border-color: #000; font-weight: 600;">Standalone Page ↗</a>`;
                linksHtml += '</div>';
            } else {
                linksHtml = `<div class="modal-links-bar"><a href="projects/${projectId}.html" class="modal-action-link" style="border-color: #000; font-weight: 600;">Standalone Page ↗</a></div>`;
            }

            let tagsHtml = '';
            if (data.tags && data.tags.length > 0) {
                tagsHtml = '<div class="port-card-tags" style="margin-top: 14px; margin-bottom: 0;">';
                data.tags.forEach(t => {
                    tagsHtml += `<span class="port-tag">${t}</span>`;
                });
                tagsHtml += '</div>';
            }

            let demosHtml = '';
            if (data.demos && data.demos.length > 0) {
                data.demos.forEach(d => {
                    let metricsHtml = '';
                    if (d.metrics && d.metrics.length > 0) {
                        metricsHtml = '<div class="modal-metrics-grid">';
                        d.metrics.forEach(m => {
                            metricsHtml += `
                                <div class="modal-metric-card">
                                    <div class="modal-metric-val">${m.value}</div>
                                    <div class="modal-metric-lbl">${m.label}</div>
                                </div>
                            `;
                        });
                        metricsHtml += '</div>';
                    }

                    demosHtml += `
                        <div class="modal-section">
                            <h4 class="modal-section-title">${d.title}</h4>
                            <p class="modal-body-text">${d.desc}</p>
                            ${metricsHtml}
                        </div>
                    `;
                });
            }

            let specsHtml = '';
            if (data.specs && data.specs.length > 0) {
                specsHtml = '<div class="modal-section"><h4 class="modal-section-title">Technical Specifications &amp; Stack</h4><ul class="modal-bullets">';
                data.specs.forEach(s => {
                    specsHtml += `<li>${s}</li>`;
                });
                specsHtml += '</ul></div>';
            }

            let mediaHtml = data.mediaHtml || '';

            modalContent.innerHTML = `
                <div class="modal-header">
                    <div class="modal-badge-row">
                        <span class="modal-badge">${data.badge}</span>
                        <span class="modal-date">${data.status}</span>
                    </div>
                    <h2 class="modal-title">${data.title}</h2>
                    ${tagsHtml}
                    ${linksHtml}
                </div>

                ${mediaHtml}

                <div class="modal-section">
                    <h4 class="modal-section-title">Project Overview &amp; Motivation</h4>
                    <p class="modal-body-text">${data.overview}</p>
                </div>

                <div class="modal-section">
                    <h4 class="modal-section-title">System Architecture &amp; Methodology</h4>
                    <div class="modal-body-text">${data.architecture}</div>
                </div>

                ${demosHtml}
                ${specsHtml}
            `;

            modal.style.display = 'flex';
            modal.offsetHeight;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
            modal.setAttribute('aria-hidden', 'false');

            const modalVideo = modalContent.querySelector('video');
            if (modalVideo) {
                modalVideo.muted = true;
                modalVideo.defaultMuted = true;
                modalVideo.playsInline = true;
                modalVideo.play().catch(() => {});
            }
        }

        function closeProjectModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
            modal.setAttribute('aria-hidden', 'true');
            setTimeout(() => {
                if (!modal.classList.contains('active')) {
                    modal.style.display = 'none';
                    modalContent.innerHTML = '';
                }
            }, 200);
        }

        // Open modal when card clicked
        document.querySelectorAll('.port-card').forEach(card => {
            card.addEventListener('click', (e) => {
                // If clicked an external link directly, let it open
                if (e.target.closest('a')) return;
                const projectId = card.getAttribute('data-project-id');
                if (projectId) {
                    openProjectModal(projectId);
                }
            });
        });

        modalBackdrop.addEventListener('click', closeProjectModal);
        modalClose.addEventListener('click', closeProjectModal);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) {
                closeProjectModal();
            }
        });

        // Autoplay guarantee for card background videos
        function playCardVideos() {
            document.querySelectorAll('.port-card-media-box video').forEach(video => {
                video.muted = true;
                video.defaultMuted = true;
                video.playsInline = true;
                const promise = video.play();
                if (promise !== undefined) {
                    promise.catch(() => {
                        const unlock = () => {
                            video.play().catch(() => {});
                        };
                        window.addEventListener('click', unlock, { once: true });
                        window.addEventListener('scroll', unlock, { once: true });
                        window.addEventListener('touchstart', unlock, { once: true });
                    });
                }
            });
        }

        window.addEventListener('DOMContentLoaded', playCardVideos);
        window.addEventListener('load', playCardVideos);

        // Check hash on load (e.g. #unitree-go2)
        window.addEventListener('load', () => {
            const hash = window.location.hash.replace('#', '').replace('project-', '');
            if (hash && projectsData[hash]) {
                openProjectModal(hash);
            }
        });
    </script>
</body>
</html>
